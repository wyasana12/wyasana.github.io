<!doctype html>
<html lang="id">

<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #090E1A;
      color: #F3F4F6;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      font-size: 0.85rem;

      letter-spacing: 0.12em;

      margin-bottom: 0.5rem;

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #9CA3AF;
      font-size: 0.92rem;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.35rem;
      border-radius: 0.5rem;
      background: #38BDF8;
      color: #090E1A;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
    }
